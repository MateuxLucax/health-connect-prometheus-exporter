name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go vet -tags integration ./...
      - run: go test ./...

  integration:
    runs-on: ubuntu-latest
    env:
      PROMETHEUS_VERSION: 3.5.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Start Prometheus
        run: |
          cd "$RUNNER_TEMP"
          tarball="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          base="https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/sha256sums.txt"
          grep " ${tarball}\$" sha256sums.txt | sha256sum -c
          tar xzf "$tarball"
          "$RUNNER_TEMP/prometheus-${PROMETHEUS_VERSION}.linux-amd64/prometheus" \
            --config.file="$GITHUB_WORKSPACE/prometheus.yml" \
            --storage.tsdb.path="$RUNNER_TEMP/prometheus-data" \
            --web.enable-remote-write-receiver \
            --web.listen-address=127.0.0.1:9090 > "$RUNNER_TEMP/prometheus.log" 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:9090/-/ready && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/prometheus.log"; exit 1
      - run: go test -tags integration -count=1 -run TestIntegration ./...
        env:
          PROMETHEUS_URL: http://127.0.0.1:9090

  docker:
    needs: [test, integration]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: version
        if: github.ref == 'refs/heads/main'
        run: |
          minor=$(cat VERSION)
          echo "minor=$minor" >> "$GITHUB_OUTPUT"
          echo "version=$minor.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/mateuxlucax/health-connect-prometheus-exporter
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.docker.outputs.version }}
    steps:
      - run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists"
            exit 0
          fi
          notes=$(printf '```sh\ndocker pull ghcr.io/mateuxlucax/health-connect-prometheus-exporter:%s\n```\n\nMulti-arch image: `linux/amd64`, `linux/arm64`.\n' "$VERSION")
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes --notes "$notes"
