services:
  exporter:
    image: ghcr.io/mateuxlucax/health-connect-prometheus-exporter:latest
    # Or build from source instead:
    # build: .
    restart: unless-stopped
    environment:
      # At least 32 characters, e.g. from `openssl rand -hex 32`. Put it in a
      # .env file next to docker-compose.yml: AUTH_TOKEN=...
      AUTH_TOKEN: ${AUTH_TOKEN:?set AUTH_TOKEN to a long random string}
      REMOTE_WRITE_URL: http://prometheus:9090/api/v1/write
    ports:
      - "8080:8080"
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      # Default retention is only 15d; keep health history for years.
      - --storage.tsdb.retention.time=10y
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # No published port: Prometheus has no authentication, and the exporter
    # reaches it on the compose network. For local Grafana or debugging,
    # publish it on localhost only:
    # ports:
    #   - "127.0.0.1:9090:9090"

volumes:
  prometheus-data:
